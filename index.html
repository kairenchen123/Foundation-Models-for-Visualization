<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可视化领域综述论文库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.12);
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --accent: #10b981;
      --accent2: #3b82f6;
      --radius: 14px;
      --radius2: 8px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
    }
    [data-theme="dark"] {
      --bg: #07090f;
      --surface: #0e1220;
      --surface2: #141929;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.10);
      --text: #e2e8f0;
      --text2: #8892a4;
      --text3: #4a5568;
      --accent: #6ee7b7;
      --accent2: #3b82f6;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    /* BG ORBS */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; animation: float 20s ease-in-out infinite; }
    .orb-1 { width: 600px; height: 600px; background: #10b981; top: -200px; left: -200px; animation-delay: 0s; }
    .orb-2 { width: 500px; height: 500px; background: #3b82f6; top: 50%; right: -150px; animation-delay: -7s; }
    .orb-3 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; left: 30%; animation-delay: -14s; }
    [data-theme="dark"] .orb-1 { background: #6ee7b7; }
    [data-theme="dark"] .orb-3 { background: #f472b6; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,-40px) scale(1.05); }
      66% { transform: translate(-30px,30px) scale(0.95); }
    }
    /* HEADER */
    header { position: relative; z-index: 10; padding: 60px 40px 40px; text-align: center; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.2);
      border-radius: 100px; font-size: 12px; font-weight: 500;
      color: var(--accent); letter-spacing: 0.5px; margin-bottom: 20px;
    }
    .header-badge::before {
      content: ''; width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.8); } }
    header h1 { font-family: 'Inter', sans-serif; font-size: clamp(28px, 5vw, 52px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 14px; }
    header h1 span { color: var(--accent); }
    header p { font-size: 15px; color: var(--text2); max-width: 560px; margin: 0 auto; line-height: 1.7; }
    .stats-row { display: flex; justify-content: center; gap: 32px; margin-top: 28px; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
    /* CONTROLS */
    .controls {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 16px 40px;
    }
    .controls-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
    /* Theme toggle */
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: var(--radius2);
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text2); cursor: pointer; transition: all 0.2s;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    #searchInput {
      width: 100%; padding: 11px 14px 11px 42px;
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: var(--radius2); color: var(--text); font-size: 14px;
      font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    #searchInput::placeholder { color: var(--text3); }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,231,183,0.12); }
    /* FILTER GRID */
    .filter-grid { display: flex; flex-direction: column; gap: 12px; }
    .filter-grid-row { display: grid; grid-template-columns: 1fr 340px; gap: 12px 24px; align-items: start; }
    .filter-section { display: flex; flex-direction: column; gap: 8px; }
    .filter-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    /* Category pills */
    .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-pill {
      padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border2);
      background: transparent; color: var(--text2); font-size: 12px; font-weight: 500;
      font-family: inherit; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .cat-pill:hover { border-color: var(--accent); color: var(--accent); background: rgba(110,231,183,0.06); }
    .cat-pill.active { background: rgba(110,231,183,0.12); border-color: var(--accent); color: var(--accent); }
    /* Sub-task pills */
    .sub-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .sub-pill {
      padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border2);
      background: transparent; color: var(--text2); font-size: 11px; font-weight: 500;
      font-family: inherit; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .sub-pill:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(59,130,246,0.07); }
    .sub-pill.active { background: rgba(59,130,246,0.12); border-color: var(--accent2); color: var(--accent2); }
    .sub-pill.all-btn { border-style: dashed; }
    .sub-pill.all-btn.active { border-style: solid; }
    .sub-hint { font-size: 11px; color: var(--text3); padding: 5px 0; }
    /* Year slider */
    .year-section { display: flex; flex-direction: column; gap: 8px; }
    .year-bounds { display: flex; align-items: center; gap: 20px; }
    .year-bound-box { text-align: center; min-width: 40px; }
    .year-bound-val { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800; color: var(--accent); line-height: 1; }
    .year-bound-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .year-sep { color: var(--text3); font-size: 16px; margin: 0 4px; }
    /* Line-style year slider — half width, beside categories */
    .year-track {
      position: relative;
      height: 40px;
      margin: 4px 0;
      padding: 14px 0 0 0;
    }
    .year-line-bg {
      position: absolute;
      left: 10px; right: 10px;
      top: 14px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .year-line-fill {
      position: absolute;
      top: 14px;
      left: 0;
      height: 6px;
      background: linear-gradient(90deg, #6ee7b7, #3b82f6);
      border-radius: 10px;
      transition: left 0.08s ease, width 0.08s ease;
    }
    .year-labels {
      position: absolute;
      left: 10px; right: 10px;
      top: 26px;
      display: flex;
      justify-content: space-between;
    }
    .year-tick {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: var(--text3);
      line-height: 1;
    }
    .year-tick.active { color: var(--accent); font-weight: 600; }
    /* Drag handles — aligned to year line */
    .year-handle {
      position: absolute;
      top: 7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: grab;
      transition: box-shadow 0.15s;
      z-index: 10;
    }
    .year-handle:hover { box-shadow: 0 0 0 5px rgba(110,231,183,0.25), 0 2px 8px rgba(0,0,0,0.4); }
    .year-handle:active { cursor: grabbing; }
    .year-handle.end { border-color: var(--accent2); }
    /* Result count */
    .result-count { font-size: 12px; color: var(--text3); display: flex; align-items: center; }
    .result-count strong { color: var(--accent); font-weight: 600; }
    /* GRID */
    .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 32px 40px 80px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    /* PAPER CARD */
    .paper-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; cursor: pointer; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow);
    }
    .paper-card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent); }
    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #e2e8f0 100%);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    [data-theme="dark"] .card-thumb { background: linear-gradient(135deg, #0e1929 0%, #1a2540 50%, #0d1a2d 100%); }
    .card-thumb:has(.thumb-img)::after { display: none; }
    .card-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(14,18,32,0.95) 100%); pointer-events: none; }
    [data-theme="dark"] .card-thumb::after { background: linear-gradient(to bottom, transparent 50%, rgba(14,18,32,0.95) 100%); }
    .thumb-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
    .card-year { font-size: 11px; font-weight: 600; color: var(--accent); font-family: 'Inter', sans-serif; letter-spacing: 0.5px; margin-bottom: 5px; }
    .card-title {
      font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.5;
      margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; flex: 1;
    }
    .card-authors {
      font-size: 11px; color: var(--text3); line-height: 1.4;
      margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .card-tag { padding: 3px 9px; border-radius: 100px; font-size: 10px; font-weight: 500; border: 1px solid; }
    /* Tag colors */
    .tag-l1 { color:#fbbf24; border-color:rgba(251,191,36,.3); background:rgba(251,191,36,.07); }
    .tag-l2 { color:#fb923c; border-color:rgba(251,146,60,.3);  background:rgba(251,146,60,.07);  }
    .tag-l3 { color:#a78bfa; border-color:rgba(167,139,250,.3); background:rgba(167,139,250,.07); }
    .tag-g1 { color:#34d399; border-color:rgba(52,211,153,.3);  background:rgba(52,211,153,.07); }
    .tag-g2 { color:#60a5fa; border-color:rgba(96,165,250,.3);  background:rgba(96,165,250,.07); }
    .tag-g3 { color:#2dd4bf; border-color:rgba(45,212,191,.3); background:rgba(45,212,191,.07); }
    .tag-j1 { color:#f9a8d4; border-color:rgba(249,168,212,.3); background:rgba(249,168,212,.07); }
    .tag-j2 { color:#fca5a5; border-color:rgba(252,165,165,.3); background:rgba(252,165,165,.07); }
    .tag-j3 { color:#93c5fd; border-color:rgba(147,197,253,.3); background:rgba(147,197,253,.07); }
    /* EMPTY */
    .empty-state { text-align: center; padding: 80px 20px; color: var(--text3); }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }
    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: transparent;
      backdrop-filter: blur(6px) saturate(180%); -webkit-backdrop-filter: blur(6px) saturate(180%);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2); border-radius: 20px;
      width: 100%; max-width: 780px; max-height: 88vh; overflow-y: auto;
      transform: scale(0.96) translateY(10px); transition: transform 0.25s ease; position: relative;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal::-webkit-scrollbar { width: 6px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .modal-hero {
      width: 100%; aspect-ratio: 16/7; border-radius: 20px 20px 0 0;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #e2e8f0 100%);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    [data-theme="dark"] .modal-hero { background: linear-gradient(135deg, #0e1929 0%, #1a2540 50%, #0d1a2d 100%); }
    .modal-hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
      border-radius: 50%; background: rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.1);
      color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 10;
    }
    .modal-close:hover { background: rgba(0,0,0,0.25); }
    .modal-body { padding: 28px 32px 36px; }
    .modal-year { font-size: 12px; font-weight: 600; color: var(--accent); font-family: 'Inter', sans-serif; letter-spacing: 0.5px; margin-bottom: 10px; }
    .modal-title { font-size: 22px; font-weight: 700; line-height: 1.35; color: var(--text); margin-bottom: 18px; font-family: 'Inter', sans-serif; letter-spacing: -0.02em; }
    .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .modal-meta-item { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; background: var(--surface); border: 1px solid var(--border2); border-radius: 100px; font-size: 12px; color: var(--text2); }
    .modal-section-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-top: 22px; }
    .modal-abstract { font-size: 14px; line-height: 1.8; color: var(--text2); }
    .modal-keywords { display: flex; flex-wrap: wrap; gap: 6px; }
    .modal-authors-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
    .modal-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
      border-radius: var(--radius2); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; font-family: inherit;
    }
    .modal-link-primary { background: var(--accent); color: #07090f; }
    .modal-link-primary:hover { background: #a7f3d0; transform: translateY(-1px); }
    .modal-link-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border2); }
    .modal-link-secondary:hover { border-color: var(--accent2); color: var(--accent2); transform: translateY(-1px); }
    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
    /* CARD ANIMATION */
    .paper-card { opacity: 0; transform: translateY(20px); }
    .paper-card.visible { animation: cardEntrance 0.4s ease forwards; }
    @keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) {
      header { padding: 40px 20px 28px; }
      .controls { padding: 12px 16px; }
      .container { padding: 24px 16px 60px; }
      .modal-body { padding: 20px 20px 28px; }
      .stats-row { gap: 20px; }
      .filter-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<script src="data_fixed.js"></script>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<header>
  <div class="header-badge">VISUAL LITERATURE DATABASE</div>
  <h1>可视化领域<span>综述论文库</span></h1>
  <p>本页面收录了可视化领域近年的核心研究论文，支持按标题、关键词、年份范围及任务分类进行检索与浏览</p>
  <div class="stats-row">
    <div class="stat-item"><div class="stat-num" id="totalCount">—</div><div class="stat-label">论文总数</div></div>
    <div class="stat-item"><div class="stat-num" id="yearRange">—</div><div class="stat-label">覆盖年份</div></div>
    <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">大类</div></div>
    <div class="stat-item"><div class="stat-num">9</div><div class="stat-label">细分任务</div></div>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="controls-inner">
    <div class="search-row">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索论文标题、关键词或摘要..." />
      </div>
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <!-- Categories + Year slider side by side -->
    <div class="filter-grid-row">
      <div class="filter-section">
        <div class="filter-label">类别</div>
        <div class="cat-pills" id="catPills">
          <button class="cat-pill active" data-group="">全部</button>
          <button class="cat-pill" data-group="lx">可视化理解</button>
          <button class="cat-pill" data-group="gs">可视化生成</button>
          <button class="cat-pill" data-group="jh">可视化交互</button>
        </div>
        <div class="sub-hint" id="subHint">请先选择类别以查看任务子类</div>
        <div class="sub-row" id="subRow"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">年份范围</div>
        <div class="year-section">
          <div class="year-bounds">
            <div class="year-bound-box">
              <div class="year-bound-val" id="yearStartVal">2018</div>
              <div class="year-bound-lbl">起始</div>
            </div>
            <span class="year-sep">–</span>
            <div class="year-bound-box">
              <div class="year-bound-val" id="yearEndVal">2026</div>
              <div class="year-bound-lbl">截止</div>
            </div>
          </div>
          <div class="year-track" id="yearTrack">
            <div class="year-line-bg"></div>
            <div class="year-line-fill" id="yearLineFill"></div>
            <div class="year-labels" id="yearLabels"></div>
            <div class="year-handle start" id="yearHandleStart"></div>
            <div class="year-handle end" id="yearHandleEnd"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Result count -->
    <div class="result-count" id="resultCount">共 <strong>—</strong> 篇</div>
  </div>
</div>

<!-- GRID -->
<div class="container">
  <div class="paper-grid" id="paperGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9.172 16.172a4 4 0 0 1 5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
    <p>未找到匹配的论文，请尝试调整筛选条件</p>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="modal-hero" id="modalHero"></div>
    <div class="modal-body">
      <div class="modal-year" id="modalYear"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-section-title">摘要</div>
      <p class="modal-abstract" id="modalAbstract"></p>
      <div class="modal-section-title">作者</div>
      <div class="modal-authors" id="modalAuthors"></div>
      <div class="modal-section-title">论文与代码</div>
      <div class="modal-links" id="modalLinks"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const GROUPS = {
  lx: { label: '可视化理解', subTasks: [
    { id: 'l1', name: '基础信息提取' },
    { id: 'l2', name: '高级语义提取' },
    { id: 'l3', name: '可视化转代码' },
  ]},
  gs: { label: '可视化生成', subTasks: [
    { id: 'g1', name: '可视化推荐' },
    { id: 'g2', name: '可控生成' },
    { id: 'g3', name: '多视图生成' },
  ]},
  jh: { label: '可视化交互', subTasks: [
    { id: 'j1', name: '多模态交互感知' },
    { id: 'j2', name: '交互生成与推荐' },
    { id: 'j3', name: '代理视觉分析' },
  ]},
};

/* Old category → new sub-task mapping. Some old cats span multiple sub-tasks. */
const OLD_TO_NEW = {
  '可视化基础信息提取': [{ group: 'lx', sub: 'l1' }],
  '可视化高级语义提取': [{ group: 'lx', sub: 'l2' }],
  '可视化转代码':        [{ group: 'lx', sub: 'l3' }],
  '可视化推荐':          [{ group: 'gs', sub: 'g1' }],
  '可视化可控生成':      [{ group: 'gs', sub: 'g2' }],
  '多视图生成':          [{ group: 'gs', sub: 'g3' }],
  '可视化交互':          [{ group: 'jh', sub: 'j1' }, { group: 'jh', sub: 'j2' }, { group: 'jh', sub: 'j3' }],
};

const TAG_CLASS = {
  l1:'tag-l1', l2:'tag-l2', l3:'tag-l3',
  g1:'tag-g1', g2:'tag-g2', g3:'tag-g3',
  j1:'tag-j1', j2:'tag-j2', j3:'tag-j3',
};

const TAG_COLOR = {
  l1:'#fbbf24', l2:'#fb923c', l3:'#a78bfa',
  g1:'#34d399', g2:'#60a5fa', g3:'#2dd4bf',
  j1:'#f9a8d4', j2:'#fca5a5', j3:'#93c5fd',
};

/* ============================================================
   STATE
   ============================================================ */
let allPapers   = [];
let activeGroup     = '';
let activeSubTasks  = [];
let activeYearStart = 2018;
let activeYearEnd   = 2026;
let searchQ         = '';

/* ============================================================
   YEAR SLIDER (line-style)
   ============================================================ */
const YEAR_MIN = 2018, YEAR_MAX = 2026;
const YEARS = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
const yearTrack    = document.getElementById('yearTrack');
const yearLineFill = document.getElementById('yearLineFill');
const yearLabels   = document.getElementById('yearLabels');
const yearHandleS  = document.getElementById('yearHandleStart');
const yearHandleE  = document.getElementById('yearHandleEnd');
const yearStartEl  = document.getElementById('yearStartVal');
const yearEndEl    = document.getElementById('yearEndVal');

function yearIdx(y) { return YEARS.indexOf(y); }

function buildYearLabels() {
  yearLabels.innerHTML = '';
  // Only show 2018 and 2026
  [YEAR_MIN, YEAR_MAX].forEach(y => {
    const span = document.createElement('span');
    span.className = 'year-tick' + (y === YEAR_MIN ? '' : '');
    span.dataset.year = y;
    span.textContent = y;
    yearLabels.appendChild(span);
  });
}

function updateYearSlider() {
  const si = yearIdx(activeYearStart) / (YEARS.length - 1);
  const ei = yearIdx(activeYearEnd)   / (YEARS.length - 1);
  // Handle size = 20px, side padding = 10px
  const handleSz = 20;
  const pad = 10;
  const trackW = yearTrack.offsetWidth;
  if (trackW === 0) return; // element not yet rendered, skip
  const handleL = trackW - handleSz;

  // Handle positions: 10px side padding, centered on track point
  yearHandleS.style.left = (pad + si * handleL) + 'px';
  yearHandleE.style.left = (pad + ei * handleL) + 'px';

  // Line fill: from start handle to end handle
  yearLineFill.style.left  = (pad + si * handleL) + 'px';
  yearLineFill.style.width = ((ei - si) * handleL) + 'px';

  // Active labels (always active since only 2018 & 2026 shown)
  yearLabels.querySelectorAll('.year-tick').forEach(el => el.classList.add('active'));

  yearStartEl.textContent = activeYearStart;
  yearEndEl.textContent   = activeYearEnd;
}

let dragging = null;

function startDrag(e, handle) {
  e.preventDefault();
  e.stopPropagation();
  dragging = handle;
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  document.addEventListener('touchend', stopDrag);
}

function onDrag(e) {
  if (!dragging) return;
  e.preventDefault();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const rect = yearTrack.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const idx = Math.round(ratio * (YEARS.length - 1));
  const y = YEARS[Math.max(0, Math.min(YEARS.length - 1, idx))];
  if (dragging === 'start') {
    activeYearStart = Math.min(y, activeYearEnd);
  } else {
    activeYearEnd = Math.max(y, activeYearStart);
  }
  updateYearSlider();
  render();
}

function stopDrag() {
  dragging = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchmove', onDrag);
  document.removeEventListener('touchend', stopDrag);
}

yearHandleS.addEventListener('mousedown', e => startDrag(e, 'start'));
yearHandleS.addEventListener('touchstart', e => startDrag(e, 'start'), { passive: false });
yearHandleE.addEventListener('mousedown', e => startDrag(e, 'end'));
yearHandleE.addEventListener('touchstart', e => startDrag(e, 'end'), { passive: false });

// Click on track to jump to nearest year
yearTrack.addEventListener('click', e => {
  if (e.target === yearHandleS || e.target === yearHandleE) return;
  if (e.target.classList.contains('year-handle')) return;
  const rect = yearTrack.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const idx = Math.round(ratio * (YEARS.length - 1));
  const y = YEARS[idx];
  // Decide: if closer to start handle, move start; else move end
  const si = yearIdx(activeYearStart) / (YEARS.length - 1);
  const ei = yearIdx(activeYearEnd)   / (YEARS.length - 1);
  if (Math.abs(ratio - si) <= Math.abs(ratio - ei)) {
    activeYearStart = Math.min(y, activeYearEnd);
  } else {
    activeYearEnd = Math.max(y, activeYearStart);
  }
  updateYearSlider();
  render();
});

buildYearLabels();
// rAF: defer to after first paint so offsetWidth is non-zero
requestAnimationFrame(() => {
  requestAnimationFrame(() => updateYearSlider());
});
window.addEventListener('resize', () => updateYearSlider());

/* ============================================================
   CATEGORY PILLS
   ============================================================ */
document.getElementById('catPills').addEventListener('click', e => {
  const pill = e.target.closest('.cat-pill');
  if (!pill) return;
  activeGroup    = pill.dataset.group;
  activeSubTasks = [];
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  renderSubPills();
  render();
});

function renderSubPills() {
  const row  = document.getElementById('subRow');
  const hint = document.getElementById('subHint');

  if (!activeGroup) {
    row.innerHTML  = '';
    hint.textContent = '请先选择类别以查看任务子类';
    return;
  }

  hint.textContent = `「${GROUPS[activeGroup].label}」下的任务（可多选）：`;

  // "全部" button
  const allActive = activeSubTasks.length === 0;

  let html = `<button class="sub-pill${allActive ? ' active all-btn' : ' all-btn'}" data-sub="__all__">全部</button>`;
  html += GROUPS[activeGroup].subTasks.map(st => {
    const isActive = activeSubTasks.includes(st.id);
    return `<button class="sub-pill${isActive ? ' active' : ''}" data-sub="${st.id}">${st.name}</button>`;
  }).join('');

  row.innerHTML = html;

  row.querySelectorAll('.sub-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const sub = btn.dataset.sub;
      if (sub === '__all__') {
        activeSubTasks = [];
      } else {
        if (activeSubTasks.includes(sub)) {
          activeSubTasks = activeSubTasks.filter(x => x !== sub);
        } else {
          activeSubTasks.push(sub);
        }
        const allIds = GROUPS[activeGroup].subTasks.map(s => s.id);
        if (allIds.every(id => activeSubTasks.includes(id))) activeSubTasks = [];
      }
      renderSubPills();
      render();
    });
  });
}

/* ============================================================
   DATA LOADING
   ============================================================ */
(function init() {
  if (typeof papers === 'undefined' || !papers.length) {
    console.error('Paper data not loaded');
    return;
  }
  allPapers = papers;

  allPapers.forEach(p => {
    const mapped = p.categories.flatMap(cat => OLD_TO_NEW[cat] || []);
    p._subs   = [...new Set(mapped.map(m => m.sub))];
    p._groups = [...new Set(mapped.map(m => m.group))];
  });

  initStats();
  renderSubPills();
  render();
})();

function initStats() {
  const years = allPapers.map(p => +p.year).filter(y => !isNaN(y));
  if (!years.length) return;
  const minY = Math.min(...years), maxY = Math.max(...years);
  document.getElementById('totalCount').textContent = allPapers.length;
  document.getElementById('yearRange').textContent = `${minY}–${maxY}`;
}

/* ============================================================
   FILTER
   ============================================================ */
function getFiltered() {
  return allPapers.filter(p => {
    const y = +p.year;
    if (isNaN(y) || y < activeYearStart || y > activeYearEnd) return false;
    const q = searchQ.trim().toLowerCase();
    if (q) {
      const hay = (p.title + ' ' + p.keywords + ' ' + p.abstract).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (activeGroup) {
      if (!p._groups.includes(activeGroup)) return false;
      if (activeSubTasks.length > 0) {
        if (!activeSubTasks.some(s => p._subs.includes(s))) return false;
      }
    }
    return true;
  });
}

/* ============================================================
   THUMBNAIL SVG
   ============================================================ */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function generateThumbSvg(subId) {
  const color = TAG_COLOR[subId] || '#6ee7b7';
  const rgb   = hexToRgb(color);
  const svg   = [
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">`,
    `<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">`,
    `<stop offset="0%" stop-color="#0e1929"/>`,
    `<stop offset="50%" stop-color="#141e36"/>`,
    `<stop offset="100%" stop-color="#0d1526"/>`,
    `</linearGradient></defs>`,
    `<rect width="400" height="225" fill="url(#bg)"/>`,
    `<g stroke="rgba(${rgb},0.07)" stroke-width="1">`,
    `<line x1="0" y1="75" x2="400" y2="75"/>`,
    `<line x1="0" y1="150" x2="400" y2="150"/>`,
    `<line x1="100" y1="0" x2="100" y2="225"/>`,
    `<line x1="200" y1="0" x2="200" y2="225"/>`,
    `<line x1="300" y1="0" x2="300" y2="225"/>`,
    `</g>`,
    `<circle cx="200" cy="112" r="45" fill="none" stroke="rgba(${rgb},0.15)" stroke-width="1"/>`,
    `<circle cx="200" cy="112" r="22" fill="rgba(${rgb},0.1)"/>`,
    `<circle cx="200" cy="112" r="6"  fill="${color}"/>`,
    `<path d="M155 165 Q200 145 245 165" fill="none" stroke="rgba(${rgb},0.25)" stroke-width="2" stroke-linecap="round"/>`,
    `<rect x="140" y="60" width="120" height="80" rx="4" fill="none" stroke="rgba(${rgb},0.12)" stroke-width="1"/>`,
    `<rect x="148" y="68" width="104" height="3"  rx="1.5" fill="rgba(${rgb},0.25)"/>`,
    `<rect x="148" y="76" width="80"  height="2"  rx="1"   fill="rgba(${rgb},0.12)"/>`,
    `<rect x="148" y="82" width="92"  height="2"  rx="1"   fill="rgba(${rgb},0.12)"/>`,
    `<rect x="148" y="88" width="70"  height="2"  rx="1"   fill="rgba(${rgb},0.12)"/>`,
    `</svg>`
  ].join('');
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ============================================================
   RENDER GRID
   ============================================================ */
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getDisplaySubs(p) {
  if (!activeGroup) return p._subs;
  return p._subs.filter(s =>
    Object.values(OLD_TO_NEW).some(arr =>
      arr.some(m => m.sub === s && m.group === activeGroup)
    )
  );
}

function render() {
  const filtered = getFiltered();
  const grid  = document.getElementById('paperGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').innerHTML = `共 <strong>${filtered.length}</strong> 篇`;

  if (!filtered.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = '';

  filtered.forEach((p, i) => {
    const dispSubs = getDisplaySubs(p);
    const thumbSub = dispSubs[0] || p._subs[0] || 'l1';
    const hasImage = p.image && p.image.length;
    const thumbSvg = generateThumbSvg(thumbSub);
    const imgSrc = hasImage ? esc(encodeURI(p.image).replace(/\?/g, '%3F')) : '';
    const thumbHtml = hasImage
      ? `<img class="thumb-img" src="${imgSrc}" alt="" loading="lazy" onerror="this.onerror=null;this.outerHTML='<img class=\\'thumb-svg\\' src=\\'${thumbSvg}\\' alt=\\'\\' />'" />`
      : `<img class="thumb-svg" src="${thumbSvg}" alt="" />`;

    const tagsHtml = dispSubs.map(s => {
      const info = Object.values(GROUPS).flatMap(g => g.subTasks).find(st => st.id === s);
      return `<span class="card-tag ${TAG_CLASS[s] || ''}">${esc(info ? info.name : s)}</span>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'paper-card';
    card.style.animationDelay = `${Math.min(i * 30, 400)}ms`;
    card.innerHTML = `
      <div class="card-thumb">
        ${thumbHtml}
      </div>
      <div class="card-body">
        <div class="card-year">${esc(p.year || '—')}</div>
        <div class="card-title">${esc(p.title) || '无标题'}</div>
        <div class="card-authors">${esc(p.authors || '作者信息待补充')}</div>
        <div class="card-tags">${tagsHtml}</div>
      </div>`;
    card.addEventListener('click', () => openModal(p, p._subs));
    grid.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
  });
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(p, subs) {
  const overlay  = document.getElementById('modalOverlay');
  const hero    = document.getElementById('modalHero');
  const thumbSub = subs[0] || 'l1';
  const color    = TAG_COLOR[thumbSub] || '#6ee7b7';

  const imgSrc = p.image ? esc(encodeURI(p.image).replace(/\?/g, '%3F')) : '';
  hero.innerHTML = p.image
    ? `<img src="${imgSrc}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.outerHTML='<img src=\\'${generateThumbSvg(thumbSub)}\\' alt=\\'\\' style=\\'width:100%;height:100%;object-fit:cover;\\' />'" />`
    : `<img src="${generateThumbSvg(thumbSub)}" alt="" style="width:100%;height:100%;object-fit:cover;" />`;

  document.getElementById('modalYear').textContent  = p.year || '—';
  document.getElementById('modalTitle').textContent = p.title || '无标题';

  const allInfo = Object.values(GROUPS).flatMap(g => g.subTasks);
  document.getElementById('modalMeta').innerHTML = subs.map(s => {
    const info = allInfo.find(st => st.id === s);
    const col  = TAG_COLOR[s] || '#6ee7b7';
    return `<span class="modal-meta-item">
      <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${col}" opacity="0.85"/></svg>
      ${esc(info ? info.name : s)}
    </span>`;
  }).join('');

  document.getElementById('modalAbstract').textContent = p.abstract || '暂无摘要';

  const authEl = document.getElementById('modalAuthors');
  const authors = p.authors && p.authors.trim() ? p.authors.trim() : '暂无作者信息';
  authEl.innerHTML = `<span class="modal-authors-text">${esc(authors)}</span>`;

  const linksEl = document.getElementById('modalLinks');
  let links = '';
  if (p.doi) {
    links += `<a class="modal-link modal-link-primary" href="${esc(p.doi)}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>论文链接</a>`;
  }
  if (p.code_link && p.code_link !== '无') {
    links += `<a class="modal-link modal-link-secondary" href="${esc(p.code_link)}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>代码链接</a>`;
  }
  linksEl.innerHTML = links;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ============================================================
   SEARCH
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  render();
});

/* ============================================================
   THEME TOGGLE
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('theme') || 'light';

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('theme', theme);
}

applyTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});
</script>
